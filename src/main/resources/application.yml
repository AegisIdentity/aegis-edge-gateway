server:
  port: 8080

spring:
  application:
    name: aegis-edge-gateway
  cloud:
    gateway:
      server:
        webflux:
          # CORS is owned by the edge (the single public entry point). Handles the browser preflight
          # for every /api and /oauth2 call from the console; downstream services have Origin stripped
          # (see GatewayRoutesConfig) so they do not add a second Access-Control-Allow-Origin header.
          globalcors:
            cors-configurations:
              # Tenant-app embedded auth + per-tenant OAuth endpoints are called from tenants' OWN web
              # origins (which we cannot enumerate), so these paths get a permissive no-credentials
              # policy: they are bearer/PKCE-code based (no cookies), so CORS is not the auth boundary.
              # Entries are first-match — these MUST precede the '[/**]' catch-all.
              '[/api/v1/webauthn/**]': &tenant-app-cors
                allowedOriginPatterns: ["*"]
                allowedMethods: [GET, POST, OPTIONS]
                allowedHeaders: ["*"]
                allowCredentials: false
                maxAge: 3600
              '[/api/v1/social/**]': *tenant-app-cors
              '[/api/v1/oauth/interaction/**]': *tenant-app-cors
              '[/*/oauth2/**]': *tenant-app-cors
              '[/*/.well-known/**]': *tenant-app-cors
              '[/*/userinfo]': *tenant-app-cors
              '[/**]':
                # L-edge-4: wildcard is NOT used here — this catch-all is locked to the console origin.
                # The permissive '*' entries above are safe ONLY because allowCredentials=false holds
                # platform-wide (bearer/PKCE, never cookies): CORS is not the auth boundary. If a
                # cookie/session is ever introduced on any edge path, this no-credentials invariant and
                # the '*' origin patterns must be revisited together.
                allowedOrigins:
                  - ${AEGIS_CONSOLE_ORIGIN:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: ["*"]
                allowCredentials: false
                maxAge: 3600

aegis:
  # M-edge-3: edge rate limiting for credential-facing routes. Disabled by default so local dev / the
  # context-load test boot without Redis; enable in prod (needs the Redis store to be reachable).
  ratelimit:
    enabled: ${AEGIS_RATELIMIT_ENABLED:false}
    replenish-rate: ${AEGIS_RATELIMIT_REPLENISH:10}   # sustained tokens/sec per (tenant,IP)
    burst-capacity: ${AEGIS_RATELIMIT_BURST:20}       # max burst per (tenant,IP)
    requested-tokens: ${AEGIS_RATELIMIT_TOKENS:1}
  gateway:
    # M-edge-4: allowed request hosts (exact host or a base domain whose subdomains are allowed, e.g.
    # 'aegis.io' permits 'acme.aegis.io'). Empty = no enforcement (local dev / tests). Set in prod to
    # the gateway's own hostnames + tenant domains so a forged Host cannot drive tenant/issuer resolution.
    allowed-hosts: ${AEGIS_ALLOWED_HOSTS:}
    # M-edge-5: strip inbound X-Forwarded-*/Forwarded at the edge (gateway is the first trusted hop).
    strip-forwarded-headers: ${AEGIS_STRIP_FORWARDED:true}
    # Host -> tenant resolution via tenant-service. Off by default so the gateway boots with no
    # dependency on tenant-service or a client secret (local dev, context-load test); when off, the
    # tenant is guessed from the first DNS label, which CANNOT resolve white-label custom domains
    # like login.acme.com. Enable in any environment that sells custom sign-in domains.
    tenant-resolution:
      enabled: ${AEGIS_TENANT_RESOLUTION_ENABLED:false}
      client-id: ${AEGIS_GATEWAY_CLIENT_ID:aegis-gateway}
      # No default: when resolution is enabled the secret must be supplied explicitly.
      client-secret: ${AEGIS_GATEWAY_CLIENT_SECRET:}
      positive-ttl: ${AEGIS_TENANT_RESOLUTION_TTL:PT5M}
      # Shorter than the positive TTL on purpose: unknown hosts must not become a cheap amplifier
      # against tenant-service, but a newly-verified domain should start working quickly.
      negative-ttl: ${AEGIS_TENANT_RESOLUTION_NEG_TTL:PT30S}
  routes:
    # L-edge-3: env-overridable downstream URIs. Prod should set https:// values and rely on
    # service-mesh mTLS for the gateway->service hop; the http://localhost defaults are local-dev only.
    authorization-server: ${AUTHZ_URI:http://localhost:9000}
    identity-service: ${IDENTITY_URI:http://localhost:9102}
    tenant-service: ${TENANT_URI:http://localhost:9101}
    social-broker: ${SOCIAL_URI:http://localhost:9105}
    mfa: ${MFA_URI:http://localhost:9103}
    admin-api: ${ADMIN_API_URI:http://localhost:9107}
    scim: ${SCIM_URI:http://localhost:9106}
    agent-registry: ${AGENT_REGISTRY_URI:http://localhost:9108}
    threat-analysis: ${THREAT_ANALYSIS_URI:http://localhost:9109}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The reactive Redis starter adds a health indicator; only ping Redis when rate limiting (and thus
    # a reachable Redis) is expected, so /actuator/health stays UP in dev where no Redis runs.
    redis:
      enabled: ${AEGIS_RATELIMIT_ENABLED:false}
